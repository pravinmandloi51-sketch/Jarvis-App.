name: Build JARVIS Complete APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android Project
      run: |
        mkdir -p app/src/main/java/com/jarvis/ai
        mkdir -p app/src/main/res/values

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <application
                android:label="JARVIS"
                android:usesCleartextTraffic="true"
                android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                <activity android:name="com.jarvis.ai.MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">JARVIS</string>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/java/com/jarvis/ai/MainActivity.java
        package com.jarvis.ai;

        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import android.webkit.WebChromeClient;
        import android.webkit.PermissionRequest;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                WebView webView = new WebView(this);
                WebSettings s = webView.getSettings();
                s.setJavaScriptEnabled(true);
                s.setDomStorageEnabled(true);
                s.setMediaPlaybackRequiresUserGesture(false);

                webView.setWebChromeClient(new WebChromeClient() {
                    @Override
                    public void onPermissionRequest(final PermissionRequest request) {
                        request.grant(request.getResources());
                    }
                });

                webView.setWebViewClient(new WebViewClient());
                webView.loadUrl("http://127.0.0.1:8080");
                setContentView(webView);
            }
        }
        EOF

        cat << 'EOF' > settings.gradle
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.1'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.jarvis.ai'
            compileSdk 34

            defaultConfig {
                applicationId "com.jarvis.ai"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    signingConfig signingConfigs.debug
                }
            }
        }
        EOF

    - name: Build APK with Gradle
      run: gradle wrapper && ./gradlew assembleRelease --stacktrace

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: JARVIS-Official-App
        path: app/build/outputs/apk/release/*.apk
        
